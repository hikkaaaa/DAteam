# Типы нарушений, которые распознаёт сервис.
#
# ПОЛЯ
#   id             — ID типа (V01…)
#   key            — имя детектора в app/rules.py (null = детектор ещё не написан)
#   type           — короткое название; идёт в API как violations[].type
#   criterion      — что должен увидеть детектор (только визуально наблюдаемое)
#   norms          — ID из norms.yaml; первая — основная (выводится в ответе), остальные — дополнительные
#   not_verifiable — что по видео проверить нельзя; сервис НЕ утверждает это в description (раздел 7 ТЗ)
#   confidence     — high: однозначно видно; medium: зависит от ракурса/контекста;
#                    low: кандидат, только при явных признаках (риск ложных срабатываний)
#   status         — черновик | подтверждён (есть примеры в датасете и сверенная на adilet норма)
#   template       — description для API: только наблюдаемые факты + «может указывать на …»
#                    плейсхолдеры: {t} время начала, {dur} длительность, {n} число людей
#                    ссылка на норму добавляется кодом из norms.yaml, в шаблон не пишется
#   note           — (опц.) ограничения, исключения, источники ложных срабатываний
#
# Запрещено (ТЗ): распознавание лиц, звук, утверждения о том, чего не видно (сумма, проводка, документы в системе).

# ---------------- Личные вещи и деньги кассира ----------------

types:
- id: V01
  key: phone_at_cash_desk
  type: "Мобильный телефон на рабочем месте кассира"
  criterion: "Телефон в руке кассира или на столе в зоне кассира ≥ 1 с"
  norms: [N231_12]
  not_verifiable: "Есть ли у телефона функция фото/видеофиксации (у смартфона — как правило есть); принадлежность телефона."
  confidence: medium
  status: черновик
  template: "На {t} в зоне рабочего места кассира виден мобильный телефон (≈{dur} с). Это может указывать на нахождение в кассовом узле средства связи с функцией фото/видеофиксации."

- id: V02
  key: personal_bag_at_cash_desk
  type: "Личные вещи в кассовом узле"
  criterion: "Сумка/рюкзак/кошелёк в зоне кассира ≥ 2 с"
  norms: [N231_12]
  not_verifiable: "Принадлежность вещи кассиру; её содержимое."
  confidence: medium
  status: черновик
  template: "На {t} в зоне рабочего места кассира видна сумка или иная личная вещь (≈{dur} с). Это может указывать на хранение личных вещей в кассовом узле."

- id: V03
  key: cash_to_pocket_or_bag
  type: "Наличные перемещены в карман или личную сумку"
  criterion: "Рука с банкнотами у кармана / личной сумки кассира, банкноты исчезают из кадра"
  norms: [N231_12, N231_20_2]
  not_verifiable: "Принадлежность и назначение денег; умысел; учёт в системе."
  confidence: medium
  status: черновик
  template: "На {t} кассир перемещает банкноты к карману или личной сумке. Это может указывать на смешение кассовых и личных денег; требуется проверка человеком."
  note: "Название и описание — без оценки умысла (ТЗ: без неподтверждённых предположений)."

