documents:
  DOC_231:
    title: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    approved_by: "Постановление Правления Национального Банка РК от 29 ноября 2019 года № 231 (рег. МЮ № 19680)"
    edition: "ред. на 12.07.2026"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
  DOC_14:
    title: "Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой"
    approved_by: "Постановление Правления Национального Банка РК от 24 февраля 2020 года № 14 (рег. МЮ № 20075)"
    edition: "ред. на 24.12.2024"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"

norms:

  # ===================== Правила № 231 — Глава 2 =====================

  - id: N231_9
    doc: DOC_231
    clause: "п. 9 (гл. 2, параграф 1)"
    quote: "Банк обеспечивает наличие специальных оборудований для определения платежности и подлинности банкнот при осуществлении кассовых операций."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_12
    doc: DOC_231
    clause: "п. 12 (гл. 2, параграф 1)"
    quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка. Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_15
    doc: DOC_231
    clause: "п. 15 (гл. 2, параграф 1)"
    quote: "Передача наличных денег между кассовыми работниками банка отражается в документе учета принятых и выданных наличных денег и ценностей"
    note: "Далее в пункте — перечень реквизитов документа."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_19_1
    doc: DOC_231
    clause: "п. 19 подп. 1) (гл. 2, параграф 2)"
    quote: "проводит визуальную идентификацию клиента, вносящего наличные деньги, с документом, удостоверяющим его личность, либо данными, подтверждающими (идентифицирующими) личность клиента, полученными посредством сервиса цифровых документов;"
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_19_2
    doc: DOC_231
    clause: "п. 19 подп. 2) (гл. 2, параграф 2)"
    quote: "принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег в соответствии с пунктами 57 и 58 Правил;"
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_20_1
    doc: DOC_231
    clause: "п. 20 ч. 1 (гл. 2, параграф 2)"
    quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_20_2
    doc: DOC_231
    clause: "п. 20 ч. 2 (гл. 2, параграф 2)"
    quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_22
    doc: DOC_231
    clause: "п. 22 (гл. 2, параграф 2)"
    quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_24
    doc: DOC_231
    clause: "п. 24 подп. 3), 4) (гл. 2, параграф 2)"
    quote: "3) проверяет целостность сумки; 4) проверяет правильность пломбирования сумки."
    note: "Обязанности кассового работника при приёме наличных от подразделения инкассации."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_25
    doc: DOC_231
    clause: "п. 25 ч. 1 (гл. 2, параграф 2)"
    quote: "В случае обнаружения нарушения целостности сумки кассовый работник в присутствии работника подразделения инкассации банка или инкассаторской организации вскрывает и пересчитывает находящиеся в них наличные деньги и ценности."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_31_1
    doc: DOC_231
    clause: "п. 31 подп. 1) (гл. 2, параграф 3)"
    quote: "проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность, либо данным, подтверждающим (идентифицирующим) личность клиента, полученным посредством сервиса цифровых документов;"
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_31_4
    doc: DOC_231
    clause: "п. 31 подп. 4) (гл. 2, параграф 3)"
    quote: "пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные деньги;"
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_32
    doc: DOC_231
    clause: "п. 32 ч. 1 (гл. 2, параграф 3)"
    quote: "Кассовый работник выдает клиенту банкноты полными, неполными пачками и (или) отдельными корешками банкнот по обозначенным на упаковке суммам без полистного пересчета при условии сохранения неповрежденной упаковки. Банкноты из неполных, а также поврежденных корешков выдаются кассовым работником полистным пересчетом."
    note: "Исключение к N231_31_4: целые корешки/пачки в неповреждённой упаковке — не нарушение."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_35
    doc: DOC_231
    clause: "п. 35 (гл. 2, параграф 3)"
    quote: "Клиент пересчитывает полученные наличные деньги, не отходя от кассы, или в помещении для пересчета наличных денег клиентами в присутствии кассового работника или контролирующего работника."
    note: "Требование адресовано клиенту — формулировать как процедурное отклонение."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_38
    doc: DOC_231
    clause: "п. 38 (гл. 2, параграф 3)"
    quote: "Кассовые операции по выдаче наличных денег клиента подразделениям инкассации банка или инкассаторской организации осуществляется кассовым работником на основании препроводительного документа, соответствующего требованиям пункта 106 Правил."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_41
    doc: DOC_231
    clause: "п. 41 (гл. 2, параграф 4)"
    quote: "Банки осуществляют кассовые операции по пересчету и сортировке наличных денег на оборудовании, имеющем функцию проверки не менее двух машиночитаемых защитных признаков банкнот и монет, установленных Правилами определения платежности банкнот и монет национальной валюты Республики Казахстан, утвержденными постановлением Правления Национального Банка Республики Казахстан от 29 ноября 2017 года № 230, зарегистрированным в Реестре государственной регистрации нормативных правовых актов под номером № 16120 (далее – Правила № 230)."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_42
    doc: DOC_231
    clause: "п. 42 (гл. 2, параграф 4)"
    quote: "Кассовые операции по пересчету, сортировке и упаковке наличных денег осуществляются кассовым работником в присутствии контролирующего работника, за исключением случаев совершения кассовых операций по приему и выдаче наличных денег клиенту."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_75
    doc: DOC_231
    clause: "п. 75 (гл. 2, параграф 8)"
    quote: "Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег."
    note: "Только если в кадре кладовая/сейфовая комната, а не сейф на рабочем месте кассира."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_76
    doc: DOC_231
    clause: "п. 76 (гл. 2, параграф 8)"
    quote: "Ключи и (или) коды электронных и механических замков от двери кладовой и (или) сейфовой комнаты банка хранятся у лиц, ответственных за сохранность наличных денег."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_80
    doc: DOC_231
    clause: "п. 80 (гл. 2, параграф 8)"
    quote: "Порядок хранения, выдачи и передачи ценностей, печатей, ключей и кодов от электронных и механических замков кладовой и (или) сейфовой комнаты, пломбираторов, клише, именных штампов и ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования."
    note: "Конкретный порядок — во внутренних документах банка; ссылаться осторожно."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  # ===================== Правила № 231 — Глава 3 (инкассация) =====================

  - id: N231_89
    doc: DOC_231
    clause: "п. 89 ч. 2 (гл. 3, параграф 1)"
    quote: "Работники подразделения инкассации банка, инкассаторской организации не осуществляют функции, не связанные с инкассацией банкнот, монет и ценностей."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_98
    doc: DOC_231
    clause: "п. 98 (гл. 3, параграф 1)"
    quote: "Бригада работников подразделения инкассации банка, инкассаторской организации состоит из не менее трех человек. Водитель-инкассатор обеспечивает сохранность сумок с банкнотами, монетами и ценностями и ведет наблюдение за работой старшего бригады и инкассатора-сборщика. Инкассатор-сборщик осуществляет прием и сдачу сумок клиентов, старший бригады обеспечивает его безопасность при переносе, транспортировке от автомобильного транспорта до клиента и обратно."
    note: "Используется только в excluded (violation_types.yaml): по видео в банке состав бригады не проверяется."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_99
    doc: DOC_231
    clause: "п. 99 (гл. 3, параграф 1)"
    quote: "Допускается формировать бригаду инкассаторов из двух человек – инкассатора-сборщика и водителя-инкассатора в следующих случаях: 1) наличия в автомобильном транспорте видеокамер, запись которого доступна в режиме онлайн-просмотра руководителю или дежурному инкассатору подразделения инкассации банка, инкассаторской организации; 2) применения кейсов и контейнеров, оснащенных специальной краской."
    note: "Используется только в excluded (violation_types.yaml)."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_103
    doc: DOC_231
    clause: "п. 103 (гл. 3, параграф 1)"
    quote: "Бригада работников подразделения инкассации банка, инкассаторской организации обеспечивается экипировкой, индивидуальными средствами защиты, в том числе бронежилетами, касками (шлемами), а также служебным оружием."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_107
    doc: DOC_231
    clause: "п. 107 подп. 1), 2) (гл. 3, параграф 2)"
    quote: "Прием банкнот, монет и ценностей от клиентов осуществляется инкассатором-сборщиком, который проверяет: 1) целостность сумки; 2) правильность пломбирования (целостность шпагата, на котором закреплена пломба, ясность оттиска пломбиратора, тождественность его образцу);"
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N231_109_6
    doc: DOC_231
    clause: "п. 109-6 подп. 1) (гл. 3, параграф 2-1)"
    quote: "Выезд работника подразделения инкассации банка, инкассаторской организации по маршруту и графику инкассации банкнот, монет и ценностей не осуществляется при отсутствии: 1) экипировки, средств индивидуальной защиты, в том числе бронежилетов, касок (шлемов), а также служебного оружия;"
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  # ===================== Правила № 14 =====================

  - id: N14_8
    doc: DOC_14
    clause: "п. 8 ч. 1 (гл. 3)"
    quote: "Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N14_16_1
    doc: DOC_14
    clause: "п. 16 подп. 1) (гл. 3)"
    quote: "каждая касса имеет отдельный вход с закрывающейся на замок дверью;"
    note: "Действие п. 16 приостановлено до 01.01.2027 постановлением Правления НБРК от 24.12.2024 № 88; в этот период пункт действует в редакции, указанной в постановлении о приостановлении. Цитировать: «п. 16 подп. 1) (в редакции на период приостановления до 01.01.2027)»."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N14_16_4
    doc: DOC_14
    clause: "п. 16 подп. 4) (гл. 3)"
    quote: "передняя часть кассы оборудуется специальными транспортирующими устройствами для передачи наличных денег и ценностей. Механизм приведения в действие и фиксации транспортирующего устройства находится внутри кассы в исправном состоянии."
    note: "См. примечание к N14_16_1 о приостановлении п. 16."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null

  - id: N14_21
    doc: DOC_14
    clause: "п. 21 ч. 2 (гл. 3)"
    quote: "При устройстве бокса или погрузочно-разгрузочной площадки обеспечивается ограничение доступа и просмотра третьими лицами за осуществлением инкассации банкнот, монет и ценностей."
    source_checked: "zakon.uchet.kz (зеркало)"
    adilet_checked_at: null
