services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights:ro
      - ./storage:/app/storage
    # GPU access (requires NVIDIA Container Toolkit). Remove this block to run on CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
